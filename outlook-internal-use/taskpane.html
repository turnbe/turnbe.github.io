<!doctype html><html><head><meta charset="utf-8"><title>Internal Use Label Helper</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><style>body{font-family:Segoe UI,Arial,sans-serif;margin:20px;line-height:1.45}button{padding:8px 12px}#status{margin-top:16px;white-space:pre-wrap}</style></head><body><h2>Internal Use Label Helper</h2><p>New messages are set to <b>Internal Use</b> only when no label is already present.</p><button id="check">Check current label</button><div id="status">Ready.</div><script>
Office.onReady(function(){document.getElementById("check").onclick=function(){var out=document.getElementById("status");Office.context.sensitivityLabelsCatalog.getIsEnabledAsync(function(e){if(e.status!==Office.AsyncResultStatus.Succeeded||!e.value){out.textContent="Sensitivity label catalogue is unavailable.";return;}Office.context.sensitivityLabelsCatalog.getAsync(function(c){if(c.status!==Office.AsyncResultStatus.Succeeded){out.textContent="Could not read catalogue.";return;}Office.context.mailbox.item.sensitivityLabel.getAsync(function(r){if(r.status!==Office.AsyncResultStatus.Succeeded){out.textContent="Could not read current label.";return;}var all=[];function walk(x){for(var i=0;i<x.length;i++){all.push(x[i]);if(x[i].children)walk(x[i].children);}}walk(c.value);var name="None / unknown";for(var j=0;j<all.length;j++){if(all[j].id===r.value){name=all[j].name;break;}}out.textContent="Current sensitivity label: "+name+"\nGUID: "+(r.value||"(none)");});});});};});</script></body></html>
